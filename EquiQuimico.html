<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Equilíbrio Químico (Qc vs Kc)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 720px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #334155;
    }

    h2 { margin-top: 0; color: #f8fafc; font-size: 1.4rem; text-align: center; }
    p.subtitle { color: #94a3b8; margin: 0 0 16px 0; text-align: center; font-size: 0.88rem; }

    .equation-display {
      background-color: #020617;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 1.3rem;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      text-anchor: middle;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .box h4 { margin: 0; color: #cbd5e1; font-size: 0.95rem; }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    input[type=number] {
      width: 80px;
      padding: 4px 8px;
      background-color: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 4px;
      text-align: right;
    }

    /* Medidor de Balanço Qc / Kc */
    .gauge-container {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .comparison-badge {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-align: center;
    }

    .shift-direta { background-color: #065f46; color: #a7f3d0; border: 1px solid #10b981; }
    .shift-inversa { background-color: #991b1b; color: #fecaca; border: 1px solid #ef4444; }
    .shift-equilibrio { background-color: #075985; color: #bae6fd; border: 1px solid #38bdf8; }

    .summary-card {
      margin-top: 12px;
      padding: 12px;
      background-color: #020617;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
      color: #e2e8f0;
      font-size: 0.88rem;
      line-height: 1.5;
      border: 1px solid #334155;
    }

    button {
      margin-top: 14px;
      padding: 10px 16px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover { background-color: #0369a1; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Simulador de Equilíbrio Químico</h2>
    <p class="subtitle">Quociente de Reação (Qc) vs Constante de Equilíbrio (Kc)</p>

    <!-- Equação -->
    <div class="equation-display">
      A + B ⇌ C + D
    </div>

    <div class="grid-container">
      <!-- Constante Kc e Reagentes -->
      <div class="box">
        <h4>Reagentes & Constante</h4>
        <div class="input-row">
          <label><b>Constante Kc:</b></label>
          <input type="number" id="kc" value="4.0" step="0.1" min="0.01">
        </div>
        <hr style="border-color: #334155; width: 100%;">
        <div class="input-row">
          <label>[A] inicial (mol/L):</label>
          <input type="number" id="conc-a" value="2.0" step="0.1" min="0.001">
        </div>
        <div class="input-row">
          <label>[B] inicial (mol/L):</label>
          <input type="number" id="conc-b" value="2.0" step="0.1" min="0.001">
        </div>
      </div>

      <!-- Produtos -->
      <div class="box">
        <h4>Produtos</h4>
        <div style="height: 38px;"></div> <!-- Espaçador para alinhar -->
        <hr style="border-color: #334155; width: 100%;">
        <div class="input-row">
          <label>[C] inicial (mol/L):</label>
          <input type="number" id="conc-c" value="0.5" step="0.1" min="0">
        </div>
        <div class="input-row">
          <label>[D] inicial (mol/L):</label>
          <input type="number" id="conc-d" value="0.5" step="0.1" min="0">
        </div>
      </div>
    </div>

    <!-- Indicador de Qc vs Kc -->
    <div class="gauge-container">
      <div id="badge-status" class="comparison-badge shift-direta">
        Qc &lt; Kc (Reação Desloca para a Direita ➔)
      </div>

      <div class="summary-card" id="details">
        <!-- Detalhes do cálculo gerados dinamicamente -->
      </div>
    </div>

    <button id="btn-equilibrar">🧪 Simular Avanço até o Equilíbrio</button>
  </div>

  <script>
    const inputs = document.querySelectorAll('input');
    const badgeStatus = document.getElementById('badge-status');
    const details = document.getElementById('details');
    const btnEquilibrar = document.getElementById('btn-equilibrar');

    function calcularEquilibrio() {
      const Kc = parseFloat(document.getElementById('kc').value) || 1.0;
      let A = parseFloat(document.getElementById('conc-a').value) || 0.001;
      let B = parseFloat(document.getElementById('conc-b').value) || 0.001;
      let C = parseFloat(document.getElementById('conc-c').value) || 0;
      let D = parseFloat(document.getElementById('conc-d').value) || 0;

      // Cálculo do Quociente de Reação: Qc = ([C] * [D]) / ([A] * [B])
      const Qc = (C * D) / (A * B);

      let textoStatus = '';
      let classeBadge = '';
      let explicacao = '';

      const tol = 0.001; // Tolerância para considerar igual

      if (Math.abs(Qc - Kc) < tol) {
        classeBadge = 'shift-equilibrio';
        textoStatus = `Qc = Kc (${Qc.toFixed(2)}) — O Sistema Já Está em Equilíbrio! ⚖️`;
        explicacao = `A velocidade da reação direta é igual à velocidade da reação inversa. As concentrações não mudarão com o tempo.`;
      } else if (Qc < Kc) {
        classeBadge = 'shift-direta';
        textoStatus = `Qc (${Qc.toFixed(2)}) < Kc (${Kc.toFixed(2)}) — Sentido Direto ➔`;
        explicacao = `Há mais reagentes do que o esperado para o equilíbrio. O sistema consumirá <b>A e B</b> para formar mais <b>C e D</b> até atingir $K_c$.`;
      } else {
        classeBadge = 'shift-inversa';
        textoStatus = `Qc (${Qc.toFixed(2)}) > Kc (${Kc.toFixed(2)}) — Sentido Inverso ⬅️`;
        explicacao = `Há mais produtos do que o esperado para o equilíbrio. O sistema consumirá <b>C e D</b> para regenerar <b>A e B</b> até atingir $K_c$.`;
      }

      badgeStatus.className = `comparison-badge ${classeBadge}`;
      badgeStatus.textContent = textoStatus;

      details.innerHTML = `
        <b>Cálculo Atual do Quociente de Reação:</b><br>
        $Q_c = \\frac{[C] \\cdot [D]}{[A] \\cdot [B]} = \\frac{${C.toFixed(2)} \\cdot ${D.toFixed(2)}}{${A.toFixed(2)} \\cdot ${B.toFixed(2)}} = \\mathbf{${Qc.toFixed(3)}}$<br><br>
        <b>Diagnóstico:</b> ${explicacao}
      `;
    }

    // Função para simular a reação avançando numericamente até o equilíbrio
    btnEquilibrar.addEventListener('click', () => {
      const Kc = parseFloat(document.getElementById('kc').value) || 1.0;
      let A = parseFloat(document.getElementById('conc-a').value) || 0.001;
      let B = parseFloat(document.getElementById('conc-b').value) || 0.001;
      let C = parseFloat(document.getElementById('conc-c').value) || 0;
      let D = parseFloat(document.getElementById('conc-d').value) || 0;

      // Resolução exata da equação quadrática para A + B <=> C + D
      // (C + x)(D + x) / ((A - x)(B - x)) = Kc
      // (1 - Kc) x^2 + (C + D + Kc(A + B)) x + (C*D - Kc*A*B) = 0
      const a_eq = 1 - Kc;
      const b_eq = C + D + Kc * (A + B);
      const c_eq = (C * D) - (Kc * A * B);

      let x = 0;
      if (Math.abs(a_eq) < 1e-5) {
        x = -c_eq / b_eq;
      } else {
        const delta = b_eq * b_eq - 4 * a_eq * c_eq;
        const x1 = (-b_eq + Math.sqrt(delta)) / (2 * a_eq);
        const x2 = (-b_eq - Math.sqrt(delta)) / (2 * a_eq);

        // Escolhe a raiz viável fisicamente
        x = (A - x1 > 0 && B - x1 > 0 && C + x1 >= 0 && D + x1 >= 0) ? x1 : x2;
      }

      // Atualiza valores nos campos
      document.getElementById('conc-a').value = (A - x).toFixed(2);
      document.getElementById('conc-b').value = (B - x).toFixed(2);
      document.getElementById('conc-c').value = (C + x).toFixed(2);
      document.getElementById('conc-d').value = (D + x).toFixed(2);

      calcularEquilibrio();
    });

    inputs.forEach(input => input.addEventListener('input', calcularEquilibrio));
    calcularEquilibrio();
  </script>
</body>
</html>
