<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Interativa de Química</title>
  <!-- Ícones Phosphor (para visual moderno) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- SIDEBAR DE NAVEGAÇÃO --- */
    .sidebar {
      width: 280px;
      background-color: #0f172a;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .brand {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1e293b;
    }

    .brand i {
      font-size: 1.8rem;
      color: #38bdf8;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }

    .nav-section {
      padding: 16px 12px 8px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.8px;
    }

    .nav-list {
      list-style: none;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item button {
      width: 100%;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-item button i {
      font-size: 1.2rem;
    }

    .nav-item button:hover {
      background-color: #1e293b;
      color: #f8fafc;
    }

    .nav-item.active button {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    /* --- ÁREA PRINCIPAL DO CONTEÚDO --- */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #020617;
    }

    .top-header {
      height: 60px;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .module-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Container Dinâmico do Módulo (Iframe) */
    .viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }
  </style>
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="brand">
      <i class="ph ph-atom"></i>
      <h1>SimuQuímica Hub</h1>
    </div>

    <div class="nav-section">Módulos Interativos</div>
    <ul class="nav-list">
      <!-- Item 1: Geometria Molecular -->
      <li class="nav-item active">
        <button onclick="carregarModulo('geometria_v02.html', 'Geometria Molecular 3D (VSEPR)', this)">
          <i class="ph ph-molecule"></i>
          <span>Geometria Molecular 3D</span>
        </button>
      </li>

      <!-- Item 2: Lei de Charles -->
      <li class="nav-item">
        <button onclick="carregarModulo('leiCharles.html', 'Lei de Charles (Gases Ideais)', this)">
          <i class="ph ph-gauge"></i>
          <span>Lei de Charles</span>
        </button>
      </li>

      <!-- Item 3: Titulação Ácido-Base -->
      <li class="nav-item">
        <button onclick="carregarModulo('titulacao.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Titulação Ácido-Base</span>
        </button>
      </li>
    </ul>

      <!-- Item 4: Uso de Balança -->
      <li class="nav-item">
        <button onclick="carregarModulo('balanca.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Uso de Balança</span>
        </button>
      </li>
    </ul>

      <!-- Item 5: Uso de bureta -->
      <li class="nav-item">
        <button onclick="carregarModulo('bureta.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Uso de Bureta</span>
        </button>
      </li>
    </ul>

      <!-- Item 6: Diluicao -->
      <li class="nav-item">
        <button onclick="carregarModulo('diluicao.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Diluicao</span>
        </button>
      </li>
    </ul>

      <!-- Item 7: Equilibrio Quimico -->
      <li class="nav-item">
        <button onclick="carregarModulo('EquiQuimico.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Equilibrio Quimico</span>
        </button>
      </li>
    </ul>

      <!-- Item 8: Estequiometria -->
      <li class="nav-item">
        <button onclick="carregarModulo('estequiometria.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Estequiometria</span>
        </button>
      </li>
    </ul>

      <!-- Item 9: Lei de Boyle -->
      <li class="nav-item">
        <button onclick="carregarModulo('leiBoyle.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Lei de Boyle</span>
        </button>
      </li>
    </ul>

      <!-- Item 9: Menisco -->
      <li class="nav-item">
        <button onclick="carregarModulo('menisco.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Menisco</span>
        </button>
      </li>
    </ul>

      <!-- Item 10: Teste de Chama -->
      <li class="nav-item">
        <button onclick="carregarModulo('testeChama.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Teste de Chama</span>
        </button>
      </li>
    </ul>

  </aside>

  <!-- Área de Exibição -->
  <main class="main-wrapper">
    <header class="top-header">
      <div class="module-title" id="title-display">
        <i class="ph ph-molecule"></i>
        <span>Geometria Molecular 3D (VSEPR)</span>
      </div>
      <span class="status-badge">Módulo Ativo</span>
    </header>

    <!-- O iframe carrega o arquivo do módulo dinamicamente -->
    <iframe id="content-frame" class="viewport" src="mod-geometria.html"></iframe>
  </main>

  <script>
    function carregarModulo(urlArquivo, tituloModulo, elementoBotao) {
      // 1. Atualiza o SRC do Iframe para carregar o novo módulo
      document.getElementById('content-frame').src = urlArquivo;

      // 2. Atualiza o título no cabeçalho superior
      const iconClass = elementoBotao.querySelector('i').className;
      document.getElementById('title-display').innerHTML = `
        <i class="${iconClass}"></i>
        <span>${tituloModulo}</span>
      `;

      // 3. Atualiza o estado visual ativo dos botões no menu
      const itens = document.querySelectorAll('.nav-item');
      itens.forEach(item => item.classList.remove('active'));
      elementoBotao.parentElement.classList.add('active');
    }
  </script>
</body>
</html>
