<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Interativa de Química</title>
  <!-- Ícones Phosphor (para visual moderno) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* --- BOTÃO HAMBÚRGUER (MOBILE) --- */
    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px;
      align-items: center;
      justify-content: center;
    }

    /* --- OVERLAY DE FUNDO EM TELA PEQUENA --- */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 19;
    }

    /* --- SIDEBAR DE NAVEGAÇÃO --- */
    .sidebar {
      width: 280px;
      background-color: #0f172a;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 20;
      height: 100%;
      overflow-y: auto;
    }

    .brand {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1e293b;
    }

    .brand i {
      font-size: 1.8rem;
      color: #38bdf8;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }

    .nav-section {
      padding: 16px 12px 8px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.8px;
    }

    .nav-list {
      list-style: none;
      padding: 0 8px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item button {
      width: 100%;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-item button i {
      font-size: 1.2rem;
    }

    .nav-item button:hover {
      background-color: #1e293b;
      color: #f8fafc;
    }

    .nav-item.active button {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    /* --- ÁREA PRINCIPAL DO CONTEÚDO --- */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #020617;
    }

    .top-header {
      height: 60px;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .module-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Container Dinâmico do Módulo (Iframe) */
    .viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }

    /* --- REGRAS DE ADAPTAÇÃO PARA SMARTPHONE --- */
    @media (max-width: 768px) {
      .menu-toggle {
        display: flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.active {
        display: block;
      }

      .status-badge {
        display: none; /* Oculta em telas pequenas para economizar espaço */
      }
    }
  </style>
</head>
<body>

  <!-- Overlay para fechar o menu ao clicar fora -->
  <div class="sidebar-overlay" id="overlay" onclick="fecharSidebar()"></div>

  <!-- Menu Lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <i class="ph ph-atom"></i>
      <h1>SimuQuímica Hub</h1>
    </div>

    <div class="nav-section">Módulos Interativos</div>
    <ul class="nav-list">
      <!-- Item 1: Geometria Molecular -->
      <li class="nav-item active">
        <button onclick="carregarModulo('geometria_v02.html', 'Geometria Molecular 3D (VSEPR)', this)">
          <i class="ph ph-molecule"></i>
          <span>Geometria Molecular 3D</span>
        </button>
      </li>

      <!-- Item 2: Lei de Charles -->
      <li class="nav-item">
        <button onclick="carregarModulo('leiCharles.html', 'Lei de Charles (Gases Ideais)', this)">
          <i class="ph ph-gauge"></i>
          <span>Lei de Charles</span>
        </button>
      </li>

      <!-- Item 3: Titulação Ácido-Base -->
      <li class="nav-item">
        <button onclick="carregarModulo('titulacao.html', 'Titulação & Curva de pH', this)">
          <i class="ph ph-flask"></i>
          <span>Titulação Ácido-Base</span>
        </button>
      </li>

      <!-- Item 4: Uso de Balança -->
      <li class="nav-item">
        <button onclick="carregarModulo('balanca.html', 'Uso de Balança', this)">
          <i class="ph ph-scales"></i>
          <span>Uso de Balança</span>
        </button>
      </li>

      <!-- Item 5: Uso de bureta -->
      <li class="nav-item">
        <button onclick="carregarModulo('bureta.html', 'Uso de Bureta', this)">
          <i class="ph ph-test-tube"></i>
          <span>Uso de Bureta</span>
        </button>
      </li>

      <!-- Item 6: Diluicao -->
      <li class="nav-item">
        <button onclick="carregarModulo('diluicao.html', 'Diluição de Soluções', this)">
          <i class="ph ph-drop"></i>
          <span>Diluição</span>
        </button>
      </li>

      <!-- Item 7: Equilibrio Quimico -->
      <li class="nav-item">
        <button onclick="carregarModulo('EquiQuimico.html', 'Equilíbrio Químico', this)">
          <i class="ph ph-arrows-left-right"></i>
          <span>Equilíbrio Químico</span>
        </button>
      </li>

      <!-- Item 8: Estequiometria -->
      <li class="nav-item">
        <button onclick="carregarModulo('estequiometria.html', 'Cálculos Estequiométricos', this)">
          <i class="ph ph-calculator"></i>
          <span>Estequiometria</span>
        </button>
      </li>

      <!-- Item 9: Lei de Boyle -->
      <li class="nav-item">
        <button onclick="carregarModulo('leiBoyle.html', 'Lei de Boyle-Mariotte', this)">
          <i class="ph ph-intersect"></i>
          <span>Lei de Boyle</span>
        </button>
      </li>

      <!-- Item 10: Menisco -->
      <li class="nav-item">
        <button onclick="carregarModulo('menisco.html', 'Leitura de Menisco', this)">
          <i class="ph ph-eye"></i>
          <span>Menisco</span>
        </button>
      </li>

      <!-- Item 11: Teste de Chama -->
      <li class="nav-item">
        <button onclick="carregarModulo('testeChama.html', 'Teste de Chama', this)">
          <i class="ph ph-flame"></i>
          <span>Teste de Chama</span>
        </button>
      </li>
    </ul>
  </aside>

  <!-- Área de Exibição -->
  <main class="main-wrapper">
    <header class="top-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="menu-toggle" onclick="alternarSidebar()" aria-label="Abrir Menu">
          <i class="ph ph-list"></i>
        </button>
        <div class="module-title" id="title-display">
          <i class="ph ph-molecule"></i>
          <span>Geometria Molecular 3D (VSEPR)</span>
        </div>
      </div>
      <span class="status-badge">Módulo Ativo</span>
    </header>

    <!-- iframe iniciando diretamente com a nova versão atualizada -->
    <iframe id="content-frame" class="viewport" src="geometria_v02.html"></iframe>
  </main>

  <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function alternarSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function fecharSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    function carregarModulo(urlArquivo, tituloModulo, elementoBotao) {
      // 1. Atualiza o SRC do Iframe
      document.getElementById('content-frame').src = urlArquivo;

      // 2. Atualiza o título no cabeçalho
      const iconClass = elementoBotao.querySelector('i').className;
      document.getElementById('title-display').innerHTML = `
        <i class="${iconClass}"></i>
        <span>${tituloModulo}</span>
      `;

      // 3. Atualiza o estado visual do botão ativo
      const itens = document.querySelectorAll('.nav-item');
      itens.forEach(item => item.classList.remove('active'));
      elementoBotao.parentElement.classList.add('active');

      // 4. Recolhe o menu automaticamente no mobile
      fecharSidebar();
    }
  </script>
</body>
</html>
